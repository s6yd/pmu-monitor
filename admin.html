<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم — جدولك</title>
<style>
.ttl-pick{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.ttl-lbl{font-size:11px;color:var(--dim);margin-bottom:8px}
.ttl-btns{display:flex;flex-wrap:wrap;gap:6px}
.ttl-b{background:var(--bg);border:1px solid var(--line);color:var(--dim);
font-family:inherit;font-size:11.5px;font-weight:700;padding:7px 12px;
border-radius:9px;cursor:pointer}
.ttl-b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ttl-warn{margin-top:9px;font-size:11px;color:var(--warn);line-height:1.6}
.ttl-form{display:flex;gap:6px;margin-top:8px}
.ttl-form input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
color:var(--fg);border-radius:9px;padding:7px 10px;font-size:12px;font-family:inherit}
.ttl-form select{background:var(--bg);border:1px solid var(--line);color:var(--fg);
border-radius:9px;padding:7px 8px;font-size:12px;font-family:inherit}
.ttl-b.go{background:var(--ok,#10b981);border-color:transparent;color:#fff}
.ttl-hint{margin-top:8px;font-size:10.5px;color:var(--dim);line-height:1.7}
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
--bg:#080b12;--card:#131928;--border:#1e2740;--border2:#253050;
--accent:#3d6fff;--accent2:#6b8fff;
--open:#10b981;--open-bg:rgba(16,185,129,.08);
--close:#f43f5e;--close-bg:rgba(244,63,94,.08);
--warn:#f59e0b;--warn-bg:rgba(245,158,11,.1);
--text:#e2e8f8;--text2:#8b96b8;--text3:#4a5580;
--mono:'JetBrains Mono',monospace;--sans:'IBM Plex Sans Arabic',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}

/* ===== شاشة الدخول ===== */
.gate{position:fixed;inset:0;z-index:500;background:var(--bg);
display:flex;align-items:center;justify-content:center;padding:24px}
.gate.hide{display:none}
.gate-box{width:100%;max-width:340px;text-align:center}
.gate-icon{width:56px;height:56px;background:var(--accent);border-radius:16px;
display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px}
.gate h1{font-size:19px;font-weight:700;margin-bottom:6px}
.gate p{font-size:12.5px;color:var(--text2);margin-bottom:20px;line-height:1.6}
.gate input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);
border-radius:12px;padding:13px 15px;font-size:15px;font-family:var(--mono);
outline:none;text-align:center;letter-spacing:2px;margin-bottom:11px}
.gate input:focus{border-color:var(--accent)}
.gate button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;
padding:13px;font-size:14px;font-weight:600;font-family:var(--sans);cursor:pointer}
.gate button:disabled{opacity:.5}
.gate-err{color:var(--close);font-size:12.5px;margin-top:11px;min-height:18px}

/* ===== الهيكل ===== */
.topbar{position:sticky;top:0;z-index:100;background:rgba(8,11,18,.94);
backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 15px;
height:52px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;line-height:1.15}
.logo-icon{width:29px;height:29px;background:var(--accent);border-radius:8px;
display:flex;align-items:center;justify-content:center;font-size:15px}
.brand-sub{font-size:9.5px;font-family:var(--mono);color:var(--text3);letter-spacing:.5px;margin-top:2px}
.tb-actions{display:flex;gap:7px;align-items:center}
.icon-btn.on{border-color:var(--ok,#10b981);color:var(--ok,#10b981)}
.icon-btn{background:transparent;border:1px solid var(--border2);color:var(--text2);
border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;
font-family:var(--sans);cursor:pointer}
.icon-btn.danger{color:var(--close);border-color:var(--close)}

.tabs{position:sticky;top:52px;z-index:99;background:rgba(8,11,18,.94);
backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:none;color:var(--text3);font-family:var(--sans);
font-size:12px;font-weight:600;padding:12px 2px;cursor:pointer;position:relative}
.tab.active{color:var(--accent2)}
.tabs6{grid-template-columns:repeat(6,1fr)}
.tabs6 .tab{font-size:10.5px;padding:12px 1px}
.tab-badge{display:none;position:absolute;top:6px;inset-inline-end:3px;
background:var(--accent);color:#fff;font-size:9px;font-family:var(--mono);
padding:1px 5px;border-radius:20px;line-height:1.5}
.tab-badge.on{display:block}
.btn-bc{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;
padding:12px;font-size:13.5px;font-weight:700;font-family:var(--sans);
cursor:pointer;margin-bottom:12px}
.tk{background:var(--card);border:1px solid var(--border);border-radius:14px;
padding:13px;margin-bottom:10px;border-inline-start:3px solid var(--accent)}
.tk.closed{border-inline-start-color:var(--text3);opacity:.72}
.tk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tk-id{font-family:var(--mono);font-size:12px;color:var(--accent2);font-weight:700}
.tk-who{font-size:13px;font-weight:600;margin-top:3px}
.tk-meta{font-size:10.5px;color:var(--text3);margin-top:3px}
.tk-msgs{margin-top:11px;display:flex;flex-direction:column;gap:7px}
.tk-m{padding:9px 11px;border-radius:11px;font-size:12.5px;line-height:1.7;
white-space:pre-wrap;word-break:break-word;max-width:88%}
.tk-m.student{background:var(--bg);border:1px solid var(--border);align-self:flex-start;
border-start-start-radius:4px}
.tk-m.admin{background:rgba(61,111,255,.14);border:1px solid rgba(61,111,255,.28);
align-self:flex-end;border-start-end-radius:4px}
.tk-m-t{font-size:9.5px;color:var(--text3);margin-top:5px;font-family:var(--mono)}
.tk-photo{font-size:11px;color:var(--warn);margin-top:4px}
.fb-item{background:var(--card);border:1px solid var(--border);border-radius:13px;
padding:13px;margin-bottom:9px;border-inline-start:3px solid var(--accent)}
.fb-item.bug{border-inline-start-color:var(--close)}
.fb-item.idea{border-inline-start-color:var(--open)}
.fb-msg{font-size:13px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word}
.fb-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;font-size:10.5px;color:var(--text3)}
.fb-meta b{color:var(--text2);font-family:var(--mono);font-weight:500}
.tab-dot{display:none;width:6px;height:6px;border-radius:50%;background:var(--close);
position:absolute;top:9px;inset-inline-end:6px}
.tab-dot.on{display:block}
.tab-dot.warn{background:var(--warn)}

/* لوحة النظام */
.maint{background:var(--card);border:1px solid var(--border);border-radius:14px;
padding:14px;margin-bottom:12px}
.maint.on{background:var(--warn-bg);border-color:rgba(245,158,11,.4)}
.maint-top{display:flex;align-items:flex-start;justify-content:space-between;gap:11px}
.maint-t{font-size:14px;font-weight:700}
.maint.on .maint-t{color:var(--warn)}
.maint-s{font-size:11.5px;color:var(--text2);margin-top:5px;line-height:1.6}
.maint-msg{margin-top:11px;padding:9px 11px;background:var(--bg);border-radius:9px;font-size:12px;color:var(--text2);line-height:1.7}
.mon-grid{margin-top:12px;padding-top:11px;border-top:1px solid var(--border)}
.mon-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
font-size:12px;line-height:1.7;align-items:flex-start}
.mon-row+.mon-row{border-top:1px solid rgba(255,255,255,.04)}
.mon-k{color:var(--text3);flex-shrink:0}
.mon-v{color:var(--text);text-align:left;direction:rtl}
.mon-edit{margin-top:12px;padding-top:11px;border-top:1px solid var(--border)}
.mon-elabel{font-size:12px;font-weight:700;margin-bottom:7px}
.mon-elabel .warn{color:var(--warn);font-weight:600}
.mon-erow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px;
font-size:12px;color:var(--text3)}
.mon-erow input{background:var(--bg);border:1px solid var(--border);border-radius:9px;
color:var(--text);font-family:inherit;font-size:12.5px;padding:7px 9px;width:82px}
.mon-erow input[type=date]{width:132px}
.mon-ehint{font-size:10.5px;color:var(--text3);line-height:1.6;margin-top:3px}
.watchers{margin-top:9px;padding-top:8px;border-top:1px solid var(--border)}
.w-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.w-row:last-child{border-bottom:none}
.w-who{display:flex;flex-direction:column;gap:2px;font-size:11.5px;min-width:0}
.w-who b{font-size:12.5px}
.w-who span{color:var(--text3);font-size:10.5px;word-break:break-all}
.w-who .warn{color:var(--warn)}
.w-acts{display:flex;gap:6px;flex-shrink:0}
.w-acts .mini[disabled]{opacity:.4;pointer-events:none}
.chg{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.chg:last-of-type{border-bottom:none}
.chg-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}
.chg-code{font-size:12px;font-weight:700;font-family:var(--mono)}
.chg-ago{font-size:10.5px;color:var(--text3)}
.chg-row{display:flex;justify-content:space-between;gap:10px;
font-size:11.5px;line-height:1.9;padding:1px 0}
.chg-f{color:var(--text3);flex-shrink:0}
.chg-v{color:var(--text2);text-align:left;min-width:0;word-break:break-word}
.chg-v s{color:var(--close,#f43f5e);opacity:.75}
.chg-v b{color:var(--ok,#10b981);font-weight:600}
.alert{border-radius:12px;padding:12px 14px;margin-bottom:9px;
display:flex;gap:11px;align-items:flex-start}
.alert.bad{background:var(--close-bg);border:1px solid rgba(244,63,94,.32)}
.alert.warn{background:var(--warn-bg);border:1px solid rgba(245,158,11,.3)}
.alert.ok{background:var(--open-bg);border:1px solid rgba(16,185,129,.28)}
.alert-ic{font-size:15px;flex-shrink:0;line-height:1.5}
.alert-t{font-size:13px;font-weight:700;line-height:1.45}
.alert.bad .alert-t{color:var(--close)}
.alert.warn .alert-t{color:var(--warn)}
.alert.ok .alert-t{color:var(--open)}
.alert-h{font-size:11.5px;color:var(--text2);margin-top:4px;line-height:1.6}

.gauge{background:var(--card);border:1px solid var(--border);border-radius:14px;
padding:15px;margin-bottom:12px}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.gauge-lbl{font-size:12px;color:var(--text2)}
.gauge-val{font-family:var(--mono);font-size:15px;font-weight:500}
.bar{height:7px;background:var(--bg);border-radius:20px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:20px;background:var(--open);transition:width .4s}
.bar span.warn{background:var(--warn)}
.bar span.bad{background:var(--close)}
.gauge-sub{font-size:11px;color:var(--text3);margin-top:7px;line-height:1.6}

.spark{display:flex;align-items:flex-end;gap:2px;height:44px;margin:10px 0 6px}
.spark i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.spark i.warn{background:var(--warn)}
.spark i.bad{background:var(--close)}
.spark-ax{display:flex;justify-content:space-between;font-size:10px;
color:var(--text3);font-family:var(--mono)}

.kv{display:flex;justify-content:space-between;padding:8px 0;
border-bottom:1px solid var(--border);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--text3)}
.kv b{font-family:var(--mono);font-weight:500}
.kv b.good{color:var(--open)}.kv b.warn{color:var(--warn)}.kv b.bad{color:var(--close)}
.tab.active::after{content:'';position:absolute;bottom:0;left:15%;right:15%;
height:2px;background:var(--accent);border-radius:2px}

.main{padding:16px 13px 60px;max-width:900px;margin:0 auto}
.page{display:none}.page.active{display:block}

/* ===== بطاقات الأرقام ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:9px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px}
.kpi-num{font-family:var(--mono);font-size:22px;line-height:1;font-weight:500}
.kpi-num.good{color:var(--open)}.kpi-num.warn{color:var(--warn)}.kpi-num.bad{color:var(--close)}
.kpi-label{font-size:11px;color:var(--text3);margin-top:6px}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:3px;font-family:var(--mono)}

.sec-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;
letter-spacing:1px;margin:20px 0 10px}

/* ===== أدوات ===== */
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);
border-radius:11px;padding:10px 13px;font-size:13.5px;font-family:var(--sans);outline:none}
.toolbar input:focus{border-color:var(--accent)}
.toolbar select{background:var(--card);border:1px solid var(--border);color:var(--text);
border-radius:11px;padding:10px 12px;font-size:13px;font-family:var(--sans);outline:none;
-webkit-appearance:none;appearance:none}

/* ===== صفوف ===== */
.row{background:var(--card);border:1px solid var(--border);border-radius:13px;
padding:13px;margin-bottom:9px}
.row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.row-name{font-size:13.5px;font-weight:600;line-height:1.35}
.row-sub{font-size:11.5px;color:var(--text3);margin-top:3px;word-break:break-all}
.pill{font-size:10.5px;font-family:var(--mono);padding:3px 9px;border-radius:20px;
white-space:nowrap;flex-shrink:0}
.pill.on{background:var(--open-bg);color:var(--open);border:1px solid rgba(16,185,129,.25)}
.pill.off{background:var(--close-bg);color:var(--close);border:1px solid rgba(244,63,94,.25)}
.pill.soon{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.row-meta{display:flex;flex-wrap:wrap;gap:11px;margin-top:9px;font-size:11px;color:var(--text3)}
.row-meta b{color:var(--text2);font-family:var(--mono);font-weight:500}
.row-acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.mini{background:transparent;border:1px solid var(--border2);color:var(--text2);
border-radius:9px;padding:7px 11px;font-size:11.5px;font-weight:600;
font-family:var(--sans);cursor:pointer}
.mini.go{color:var(--open);border-color:rgba(16,185,129,.35)}
.mini.no{color:var(--close);border-color:rgba(244,63,94,.35)}

/* ===== تقييمات ===== */
.stars{font-size:12px;color:var(--warn);font-family:var(--mono);letter-spacing:1px}
.comment{background:var(--bg);border:1px solid var(--border);border-radius:10px;
padding:10px 12px;font-size:12.5px;color:var(--text2);line-height:1.7;margin-top:9px}
.comment.flag{border-color:rgba(244,63,94,.35);background:var(--close-bg)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{background:var(--bg);border:1px solid var(--border);border-radius:20px;
padding:3px 9px;font-size:10.5px;color:var(--text2)}
.flag-note{font-size:11px;color:var(--close);margin-top:7px;font-weight:600}

.empty{text-align:center;padding:44px 20px;color:var(--text3)}
.empty-icon{font-size:34px;margin-bottom:11px;opacity:.6}
.empty-t{font-size:14px;color:var(--text2);font-weight:600}
.empty-s{font-size:12px;margin-top:5px}

.spinner{width:26px;height:26px;border:2.5px solid var(--border2);border-top-color:var(--accent);
border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
background:var(--accent);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;
font-weight:600;transition:transform .3s;z-index:999;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--close)}
.toast.ok{background:var(--open)}

/* ===== درج تفاصيل الحساب ===== */
.drawer{position:fixed;inset:0;z-index:400;background:rgba(4,6,12,.82);
backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.drawer.open{display:flex}
.drawer-sheet{background:var(--bg);border:1px solid var(--border2);
border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:90vh;
overflow-y:auto;padding:16px 15px 34px;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.drawer-grip{width:38px;height:4px;background:var(--border2);border-radius:20px;margin:0 auto 15px}
.dw-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.dw-name{font-size:17px;font-weight:700}
.dw-mail{font-size:12px;color:var(--text3);margin-top:3px;word-break:break-all}
.dw-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:2px 7px}

.gpa-card{background:var(--card);border:1px solid var(--border);border-radius:15px;
padding:16px;margin:14px 0;display:flex;align-items:center;justify-content:space-between}
.gpa-val{font-family:var(--mono);font-size:32px;font-weight:500;line-height:1}
.gpa-val.hi{color:var(--open)}.gpa-val.mid{color:var(--warn)}.gpa-val.lo{color:var(--close)}
.gpa-cap{font-size:11px;color:var(--text3);margin-top:6px}
.gpa-right{text-align:left;font-size:11.5px;color:var(--text3);line-height:1.9}
.gpa-right b{color:var(--text2);font-family:var(--mono);font-weight:500}

.dw-day{margin-bottom:8px}
.dw-daylabel{font-size:11px;font-weight:600;color:var(--text3);
letter-spacing:.5px;margin-bottom:5px}
.dw-slot{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:10px;margin-bottom:5px;
border-right:3px solid var(--accent)}
.dw-time{font-family:var(--mono);font-size:10.5px;color:var(--text2);
min-width:78px;direction:ltr;text-align:center}
.dw-slot-name{font-size:12.5px;font-weight:600}
.dw-slot-sub{font-size:10.5px;color:var(--text3);margin-top:2px}

.sched-box{border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:10px;background:rgba(255,255,255,.015)}
.sched-head{display:flex;justify-content:space-between;align-items:center;
margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.sched-name{font-size:12.5px;font-weight:700}
.sched-meta{font-size:11px;color:var(--text3)}
.prep-line{font-size:12px;color:var(--text2);line-height:1.8;padding:10px 12px;
border-radius:10px;background:var(--card);border:1px solid var(--border);margin-bottom:14px}
.prep-line.yes{background:var(--open-bg);border-color:rgba(16,185,129,.28)}
.prep-note{display:block;font-size:10.5px;color:var(--text3);margin-top:5px}

.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.grade{background:var(--card);border:1px solid var(--border);border-radius:9px;
padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px}
.grade b{font-family:var(--mono);font-size:12px}
.grade b.g-hi{color:var(--open)}.grade b.g-mid{color:var(--warn)}.grade b.g-lo{color:var(--close)}
.dw-empty{font-size:12.5px;color:var(--text3);font-style:italic;padding:10px 0}

.health{background:var(--card);border:1px solid var(--border);border-radius:13px;
padding:13px;margin-bottom:14px;font-size:12.5px;line-height:1.8}
.health.bad{border-color:rgba(244,63,94,.4);background:var(--close-bg)}
.health b{color:var(--text)}
.health code{font-family:var(--mono);font-size:11.5px;background:var(--bg);
padding:1px 6px;border-radius:5px;color:var(--accent2)}
</style>
</head>
<body>

<!-- ══ بوابة الدخول ══ -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-icon">🔐</div>
    <h1>لوحة تحكم جدولك</h1>
    <p>هذي الصفحة للمشرف فقط.<br>اكتب كلمة السر عشان تدخل.</p>
    <input type="password" id="tokenInput" placeholder="••••••••••••"
           autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
    <button id="loginBtn" onclick="doLogin()">دخول</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<!-- ══ اللوحة ══ -->
<div class="topbar">
  <div class="logo">
    <div class="logo-icon">📊</div>
    <div><div>لوحة التحكم</div><div class="brand-sub">JADWALIK ADMIN</div></div>
  </div>
  <div class="tb-actions">
    <button class="icon-btn" onclick="loadAll()">🔄 تحديث</button>
    <button class="icon-btn" id="autoBtn" onclick="toggleAuto()">⏱️ تلقائي</button>
    <button class="icon-btn danger" onclick="logout()">خروج</button>
  </div>
</div>

<div class="tabs tabs6">
  <button class="tab active" data-p="over"  onclick="go('over')">نظرة عامة</button>
  <button class="tab"        data-p="users" onclick="go('users')">المستخدمين</button>
  <button class="tab"        data-p="revs"  onclick="go('revs')">التقييمات</button>
  <button class="tab"        data-p="mons"  onclick="go('mons')">المراقبة</button>
  <button class="tab"        data-p="fb"    onclick="go('fb')">تذاكر<span class="tab-badge" id="fbBadge"></span></button>
  <button class="tab"        data-p="msgs"  onclick="go('msgs')">الرسائل</button>
  <button class="tab"        data-p="sys"   onclick="go('sys')">النظام<span class="tab-dot" id="sysDot"></span></button>
</div>

<div class="main">

  <div class="page active" id="pageOver">
    <div id="overBody"><div class="spinner"></div></div>
  </div>

  <div class="page" id="pageUsers">
    <div class="toolbar">
      <input id="userSearch" placeholder="ابحث بالاسم أو الإيميل..." oninput="renderUsers()">
      <select id="userFilter" onchange="renderUsers()">
        <option value="all">الكل</option>
        <option value="active">مشترك فعّال</option>
        <option value="expired">منتهي</option>
        <option value="soon">ينتهي قريباً</option>
        <option value="tg">مربوط تيليغرام</option>
      </select>
    </div>
    <div id="usersBody"><div class="spinner"></div></div>
  </div>

  <div class="page" id="pageRevs">
    <div class="toolbar">
      <input id="revSearch" placeholder="ابحث بالدكتور أو النص..." oninput="renderRevs()">
      <select id="revFilter" onchange="renderRevs()">
        <option value="reported">🚩 مبلَّغ عنها</option>
        <option value="all">الكل</option>
        <option value="flag">ألفاظ مشبوهة</option>
        <option value="low">تقييم منخفض</option>
        <option value="hidden">مخفية</option>
      </select>
    </div>
    <div id="revsBody"><div class="spinner"></div></div>
  </div>

  <div class="page" id="pageMons">
    <div id="monsBody"><div class="spinner"></div></div>
  </div>

  <div class="page" id="pageFb">
    <button class="btn-bc" onclick="openBroadcast()">📢 بث رسالة لكل من ربط تيليغرام</button>

    <div class="toolbar">
      <input id="fbSearch" placeholder="ابحث..." oninput="renderFb()">
      <select id="fbFilter" onchange="renderFb()">
        <option value="open">تذاكر مفتوحة</option>
        <option value="closed">مغلقة</option>
        <option value="all">الكل</option>
        <option value="notes">ملاحظات الموقع</option>
      </select>
    </div>
    <div id="fbBody"><div class="spinner"></div></div>
  </div>

  <div class="page" id="pageMsgs">
    <div class="bar">
      <select id="msgKind" onchange="renderMsgs()">
        <option value="">كل الأنواع</option>
      </select>
    </div>
    <div id="msgsBody"><div class="spinner"></div></div>
  </div>

  <div class="page" id="pageSys">
    <div id="sysBody"><div class="spinner"></div></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- ══ تفاصيل حساب ══ -->
<div class="drawer" id="drawer" onclick="if(event.target===this)closeUser()">
  <div class="drawer-sheet">
    <div class="drawer-grip"></div>
    <div id="drawerBody"><div class="spinner"></div></div>
  </div>
</div>

<script>
/* ══════════ الحالة ══════════ */
let TOKEN = sessionStorage.getItem('jdw_admin') || '';
let USERS = [], REVS = [], MONS = [], STATS = null, HEALTH = null, FB = [], TICKETS = [];
let MSGS = { messages:[], kinds:[] };

/* كلمات تستدعي المراجعة — مؤشر فقط، القرار لك */
const FLAGS = ['حمار','غبي','كلب','حقير','خرا','قذر','تافه','زبالة','حيوان','لعن',
'كذاب','فاشل','عنصري','متخلف','idiot','stupid','dumb','trash','garbage','hate',
'موت','اقتل','fuck','shit','bitch','ass'];

/* ══════════ الاتصال ══════════ */
async function api(path, opts){
  opts = opts || {};
  const r = await fetch('/api/admin/' + path, {
    method: opts.body ? 'POST' : 'GET',
    headers: { 'Content-Type':'application/json', 'X-Admin-Token': TOKEN },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const j = await r.json().catch(()=>({error:'رد غير مفهوم من السيرفر'}));
  if (r.status === 401) { logout(); throw new Error('انتهت الجلسة'); }
  if (!r.ok) throw new Error(j.error || ('خطأ ' + r.status));
  return j;
}

/* ══════════ الدخول ══════════ */
async function doLogin(){
  const inp = document.getElementById('tokenInput'),
        btn = document.getElementById('loginBtn'),
        err = document.getElementById('gateErr');
  const v = inp.value.trim();
  if(!v){ err.textContent='اكتب كلمة السر'; return }
  btn.disabled = true; err.textContent = '';
  TOKEN = v;
  try{
    await api('ping');
    sessionStorage.setItem('jdw_admin', v);
    document.getElementById('gate').classList.add('hide');
    loadAll();
  }catch(e){
    TOKEN=''; err.textContent = e.message;
    inp.value=''; inp.focus();
  }finally{ btn.disabled=false }
}

function logout(){
  TOKEN=''; sessionStorage.removeItem('jdw_admin');
  document.getElementById('gate').classList.remove('hide');
  document.getElementById('tokenInput').value='';
}

/* ══════════ تنقل ══════════ */
function go(p){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.p===p));
  const ids={over:'pageOver',users:'pageUsers',revs:'pageRevs',mons:'pageMons',
             fb:'pageFb',msgs:'pageMsgs',sys:'pageSys'};
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById(ids[p]).classList.add('active');
}

/* ══════════ أدوات ══════════ */
const esc = s => String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function fdate(d){
  if(!d) return '—';
  const x=new Date(d); if(isNaN(x)) return '—';
  return x.toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'});
}
function daysLeft(d){
  if(!d) return null;
  return Math.ceil((new Date(d)-new Date())/864e5);
}
function toast(msg,kind){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+(kind||'');
  clearTimeout(t._x); t._x=setTimeout(()=>t.className='toast',2600);
}
function flagged(txt){
  const s=String(txt||'').toLowerCase();
  return FLAGS.some(w=>s.includes(w));
}

/* ══════════ تحميل ══════════ */
/* ══════════ تحديث تلقائي ══════════
   اللوحة تجلب البيانات عند الطلب، فنجدّدها كل نصف دقيقة.
   نوقفه لما تكون الصفحة في الخلفية عشان ما نستهلك بلا فائدة،
   ونتخطى الدورة لو فيه جلب شغّال أصلاً. */
let AUTO=false, autoTimer=null, loading=false;

function toggleAuto(){
  AUTO=!AUTO;
  try{ localStorage.setItem('adminAuto',AUTO?'1':'0') }catch(e){}
  paintAuto();
  if(AUTO){ autoTimer=setInterval(autoTick,30000); toast('التحديث التلقائي شغّال · كل 30 ثانية','ok') }
  else { clearInterval(autoTimer); autoTimer=null; toast('أوقفت التحديث التلقائي','ok') }
}
function paintAuto(){
  const b=document.getElementById('autoBtn');
  if(b){ b.textContent=AUTO?'⏱️ تلقائي ✓':'⏱️ تلقائي'; b.classList.toggle('on',AUTO) }
}
function autoTick(){
  if(!AUTO||document.hidden||loading)return;
  loadAll(true);
}
document.addEventListener('visibilitychange',()=>{ if(AUTO&&!document.hidden)autoTick() });

async function loadAll(silent){
  if(loading)return; loading=true;
  try{ return await loadAllInner(silent) } finally{ loading=false }
}
async function loadAllInner(silent){
  if(!TOKEN) return;
  try{
    const [s,u,r,m,h,f,tk,mg] = await Promise.all([
      api('stats'), api('users'), api('reviews'), api('monitors'),
      api('health').catch(()=>null), api('feedback').catch(()=>({feedback:[]})),
      api('tickets?status=all').catch(()=>({tickets:[]})),
      api('messages').catch(()=>({messages:[],kinds:[]}))
    ]);
    STATS=s; USERS=u.users||[]; REVS=r.reviews||[]; MONS=m.monitors||[]; HEALTH=h;
    FB=(f&&f.feedback)||[]; TICKETS=(tk&&tk.tickets)||[]; MSGS=mg||{messages:[],kinds:[]};
    renderOver(); renderUsers(); renderRevs(); renderMons(); renderFb();
    renderMsgs(); renderSys();
  }catch(e){ toast(e.message,'err') }
}

/* ══════════ نظرة عامة ══════════ */
function renderOver(){
  const s=STATS; if(!s) return;
  const needRev = REVS.filter(r=>flagged(r.comment)).length;

  let health='';
  if(HEALTH && !HEALTH.telegramOk){
    health=`<div class="health bad">
      <b>⚠️ بوت تيليغرام ما يرسل</b><br>
      ${esc(HEALTH.telegramError||'')}<br>
      تأكد أن <code>TELEGRAM_TOKEN</code> في Render ما فيه مسافة أو سطر زائد.</div>`;
  }else if(HEALTH && HEALTH.telegramOk){
    health=`<div class="health">✅ البوت شغّال — <b>${esc(HEALTH.telegramName||'')}</b></div>`;
  }

  document.getElementById('overBody').innerHTML = health + `
  <div class="sec-title">المستخدمين</div>
  <div class="kpis">
    <div class="kpi"><div class="kpi-num">${s.users}</div>
      <div class="kpi-label">حساب مسجل</div>
      ${s.hasCreatedAt?`<div class="kpi-sub">+${s.newThisWeek} هذا الأسبوع</div>`:''}</div>
    <div class="kpi"><div class="kpi-num good">${s.activeSubs}</div>
      <div class="kpi-label">اشتراك فعّال</div>
      <div class="kpi-sub">${s.users?Math.round(s.activeSubs/s.users*100):0}% من الكل</div></div>
    <div class="kpi"><div class="kpi-num ${s.expiringSoon?'warn':''}">${s.expiringSoon}</div>
      <div class="kpi-label">ينتهي خلال أسبوعين</div></div>
    <div class="kpi"><div class="kpi-num">${s.telegramLinked}</div>
      <div class="kpi-label">ربط تيليغرام</div></div>
  </div>

  <div class="sec-title">الدخل</div>
  <div class="kpis">
    <div class="kpi"><div class="kpi-num good">${s.revenue}</div>
      <div class="kpi-label">ريال (تقديري)</div>
      <div class="kpi-sub">${s.paidUsers} × 19</div></div>
    <div class="kpi"><div class="kpi-num">${s.paidUsers}</div>
      <div class="kpi-label">دفعوا فعلياً</div></div>
    <div class="kpi"><div class="kpi-num">${s.users-s.paidUsers}</div>
      <div class="kpi-label">على التجربة المجانية</div></div>
  </div>

  <div class="sec-title">الاستخدام</div>
  <div class="kpis">
    <div class="kpi"><div class="kpi-num">${s.scheduleUsers}</div>
      <div class="kpi-label">بنوا جدول</div></div>
    <div class="kpi"><div class="kpi-num">${s.monitors}</div>
      <div class="kpi-label">مادة مراقبة</div>
      <div class="kpi-sub">${s.monitoringUsers} طالب</div></div>
    <div class="kpi"><div class="kpi-num">${s.reviews}</div>
      <div class="kpi-label">تقييم دكتور</div>
      <div class="kpi-sub">متوسط ${s.avgRating}</div></div>
    <div class="kpi"><div class="kpi-num ${needRev?'bad':'good'}">${needRev}</div>
      <div class="kpi-label">يحتاج مراجعة</div></div>
  </div>`;
}

/* ══════════ المستخدمين ══════════ */
function renderUsers(){
  const q=(document.getElementById('userSearch').value||'').trim().toLowerCase();
  const f=document.getElementById('userFilter').value;

  let list=USERS.filter(u=>{
    if(q && !((u.name+' '+u.email+' '+u.major).toLowerCase().includes(q))) return false;
    const dl=daysLeft(u.expires);
    if(f==='active'  && !u.active) return false;
    if(f==='expired' &&  u.active) return false;
    if(f==='soon'    && !(u.active && dl!==null && dl<=14)) return false;
    if(f==='tg'      && !u.telegram) return false;
    return true;
  });

  const box=document.getElementById('usersBody');
  if(!list.length){
    box.innerHTML=`<div class="empty"><div class="empty-icon">👥</div>
      <div class="empty-t">ما في نتائج</div><div class="empty-s">جرّب بحث ثاني</div></div>`;
    return;
  }

  box.innerHTML=list.map(u=>{
    const dl=daysLeft(u.expires);
    let pill = u.active
      ? (dl!==null && dl<=14 ? `<span class="pill soon">${dl} يوم</span>`
                             : `<span class="pill on">فعّال</span>`)
      : `<span class="pill off">منتهي</span>`;
    if(u.isPro) pill=`<span class="pill on">PRO دائم</span>`;

    return `<div class="row">
      <div class="row-top">
        <div style="min-width:0;cursor:pointer" onclick="openUser('${u.id}')">
          <div class="row-name">${esc(u.name)} <span style="color:var(--accent2);font-size:11px">‹ تفاصيل</span></div>
          <div class="row-sub">${esc(u.email)}</div>
        </div>${pill}
      </div>
      <div class="row-meta">
        <span>التخصص <b>${esc(u.major)}</b></span>
        <span>ينتهي <b>${fdate(u.expires)}</b></span>
        <span>مراقبة <b>${u.monitors}</b></span>
        ${u.telegram?`<span>تيليغرام <b>${esc(u.telegram)}</b></span>`:''}
        ${u.createdAt?`<span>انضم <b>${fdate(u.createdAt)}</b></span>`:''}
      </div>
      <div class="row-acts">
        <button class="mini" onclick="openUser('${u.id}')">👁️ جدوله ومعدله</button>
        <button class="mini go" onclick="grant('${u.id}',365,'${esc(u.name)}')">+ سنة</button>
        <button class="mini"    onclick="grant('${u.id}',30,'${esc(u.name)}')">+ شهر</button>
        <button class="mini"    onclick="grant('${u.id}',7,'${esc(u.name)}')">+ أسبوع</button>
        ${u.telegram?`<button class="mini go" onclick="replyTo('','${esc(u.email)}','${esc(u.name)}')">💬 رسالة</button>`:''}
        ${u.active?`<button class="mini no" onclick="revoke('${u.id}','${esc(u.name)}')">إلغاء</button>`:''}
      </div>
    </div>`;
  }).join('');
}

async function grant(id,days,name){
  const label = days===365?'سنة':days===30?'شهر':'أسبوع';
  if(!confirm(`تفعيل ${label} لـ ${name}؟`)) return;
  try{
    const r=await api('grant',{body:{userId:id,days}});
    if(!r.ok) return toast(r.error||'ما ضبط','err');
    toast(`فُعّل ${label} — ينتهي ${fdate(r.expires)}`,'ok');
    await loadAll();
  }catch(e){ toast(e.message,'err') }
}

async function revoke(id,name){
  if(!confirm(`إلغاء اشتراك ${name}؟\nبيوقف عنه إشعارات المواد فوراً.`)) return;
  try{
    await api('revoke',{body:{userId:id}});
    toast('تم الإلغاء','ok');
    await loadAll();
  }catch(e){ toast(e.message,'err') }
}

async function notify(id,name){
  const txt=prompt(`رسالة تيليغرام لـ ${name}:`);
  if(!txt || !txt.trim()) return;
  try{
    const r=await api('notify',{body:{userId:id,text:txt.trim()}});
    toast(r.ok?'انرسلت ✓':(r.error||'ما انرسلت'), r.ok?'ok':'err');
  }catch(e){ toast(e.message,'err') }
}

/* ══════════ تفاصيل حساب ══════════ */
const DAY_AR={U:'الأحد',M:'الاثنين',T:'الثلاثاء',W:'الأربعاء',R:'الخميس',F:'الجمعة',S:'السبت'};
const DAY_ORDER=['U','M','T','W','R','F','S'];

function tmin(s){
  const m=String(s||'').match(/(\d{3,4})\s*[-–]\s*(\d{3,4})/);
  if(!m) return null;
  const f=x=>{x=x.padStart(4,'0');return x.slice(0,2)+':'+x.slice(2)};
  return {a:f(m[1]),b:f(m[2]),sort:parseInt(m[1].padStart(4,'0'),10)};
}

async function openUser(id){
  const dw=document.getElementById('drawer');
  dw.classList.add('open');
  document.getElementById('drawerBody').innerHTML='<div class="spinner"></div>';
  try{
    const d=await api('user?id='+encodeURIComponent(id));
    if(!d.ok) throw new Error(d.error||'ما لقيت الحساب');
    renderUserDetail(d);
  }catch(e){
    document.getElementById('drawerBody').innerHTML=
      `<div class="empty"><div class="empty-icon">⚠️</div>
       <div class="empty-t">${esc(e.message)}</div></div>`;
  }
}
function closeUser(){ document.getElementById('drawer').classList.remove('open') }

function renderUserDetail(d){
  const u=d.user;

  /* المعدل */
  const g=d.gpa;
  const cls = g===null?'':(g>=3.5?'hi':g>=2.5?'mid':'lo');
  const gpaBox=`<div class="gpa-card">
    <div>
      <div class="gpa-val ${cls}">${g===null?'—':g.toFixed(2)}</div>
      <div class="gpa-cap">المعدل التراكمي · من 4.00</div>
    </div>
    <div class="gpa-right">
      <div>ساعات محسوبة <b>${d.gpaHours}</b></div>
      <div>مواد مقيّمة <b>${d.gradedCourses}</b></div>
      <div>مواد مكتملة <b>${d.completedCount}</b></div>
    </div>
  </div>`;

  /* الجداول الثلاثة، كل واحد على حدة */
  const slotOf=s=>Number(s.slot)||1;
  const credits=list=>list.reduce((t,s)=>{
    const m=String(s.code||'').match(/(\d{4})/);
    const n=m?+m[1][2]:3;                     /* نفس منطق السيرفر تقريباً */
    return t+(n>=0&&n<=6?n||3:3);
  },0);

  const buildDays=list=>{
    let out='';
    DAY_ORDER.forEach(day=>{
      const items=list
        .filter(s=>String(s.days||'').toUpperCase().includes(day))
        .map(s=>({s,t:tmin(s.time)}))
        .sort((a,b)=>(a.t?a.t.sort:0)-(b.t?b.t.sort:0));
      if(!items.length) return;
      out+=`<div class="dw-day"><div class="dw-daylabel">${DAY_AR[day]}</div>`+
        items.map(({s,t})=>`<div class="dw-slot">
          <div class="dw-time">${t?t.a+'–'+t.b:'—'}</div>
          <div style="flex:1;min-width:0">
            <div class="dw-slot-name">${esc(s.code)} §${esc(s.section||'')} <span style="color:var(--text3);font-weight:400">· ${esc(s.crn||'')}</span></div>
            <div class="dw-slot-sub">${esc(s.room||'—')} · ${esc(s.instructor||'—')}</div>
          </div></div>`).join('')+`</div>`;
    });
    return out;
  };

  let sched='';
  const used=[1,2,3].filter(n=>d.schedule.some(s=>slotOf(s)===n));
  if(used.length){
    used.forEach(n=>{
      const list=d.schedule.filter(s=>slotOf(s)===n);
      const body=buildDays(list);
      sched+=`<div class="sched-box">
        <div class="sched-head">
          <span class="sched-name">جدول ${n}</span>
          <span class="sched-meta">${list.length} مادة · ${credits(list)} ساعة</span>
        </div>
        ${body||`<div class="dw-empty">مواد بدون أوقات</div>`}
      </div>`;
    });
  }
  if(!sched) sched=`<div class="dw-empty">ما بنى جدول بعد</div>`;

  /* الدرجات */
  const gcls=x=>{const v={'A+':4,'A':3.75,'B+':3.5,'B':3,'C+':2.5,'C':2,'D+':1.5,'D':1,'F':0}[x];

function renderRevs(){

    if(q && !((r.instructor+' '+r.comment+' '+r.course+' '+r.author).toLowerCase().includes(q))) return false;
    if(f==='flag' && !flagged(r.comment)) return false;
    if(f==='low'  && r.rating>2) return false;

          <div class="row-name">${esc(r.instructor)}</div>
          <div class="stars">${stars} <span style="color:var(--text3)">${r.rating}/5</span></div>

        <span class="pill ${bad?'off':'on'}">${esc(r.course)}</span>

      ${r.hidden?`<div class="flag-note" style="color:var(--text3)">🙈 مخفية عن الطلاب</div>`:''}

/* ══════════ الرسائل الصادرة ══════════ */
function msgWhen(ms){
  const d=new Date(ms); if(isNaN(d))return '—';
  const diff=(Date.now()-ms)/1000;
  const t=new Date(ms+3*3600e3).toISOString().slice(11,16);   /* توقيت الرياض */
  if(diff<60) return 'الحين';
  if(diff<3600) return Math.round(diff/60)+' د · '+t;
  if(diff<86400) return Math.round(diff/3600)+' س · '+t;
  return fdate(d)+' · '+t;
}

  }catch(e){ toast(e.message,'err') }
}

/* ══════════ التسخين المسبق ══════════ */
async function togglePrewarm(on){
  if(on&&!confirm('تشغيل التسخين المسبق؟ السيرفر بيجدّد أكثر ٣ تركيبات بحث طلباً قبل انتهاء صلاحيتها، فما ينتظر أي طالب سحبة كاملة.\n\nهذا يزيد الطلبات على موقع الجامعة — أوقفه لو لاحظت بطئاً منهم.'))return;
  try{
    const r=await api('prewarm-toggle',{body:{on:!!on}});
    toast(on?`التسخين شغّال — يتبع صلاحية ${r.ttlMin} دقيقة`:'التسخين موقوف','ok');
    await loadAll();
  }catch(e){ toast(e.message,'err') }
}

/* ══════════ وضع الصيانة ══════════ */
async function toggleMaint(on){
  if(on){
    const msg=prompt('رسالة تظهر للطلاب (اتركها فاضية للنص الافتراضي):',
      'نسوّي تحديث سريع للموقع. نرجع خلال وقت قصير بإذن الله.');
    if(msg===null)return;
    if(!confirm('تأكيد: بيشوف كل الطلاب صفحة الصيانة بدل الموقع.'))return;
    try{
      await api('maintenance',{body:{on:true,msg:msg.trim()}});
      toast('الموقع دخل وضع الصيانة','ok');
      await loadAll();
    }catch(e){ toast(e.message,'err') }
  }else{
    if(!confirm('ترجيع الموقع للعمل؟'))return;
    try{
      await api('maintenance',{body:{on:false}});
      toast('الموقع رجع للعمل','ok');
      await loadAll();
    }catch(e){ toast(e.message,'err') }
  }
}

async function closeTk(id){
  if(!confirm('إغلاق التذكرة #'+id+'؟ لو رسل الطالب مرة ثانية تنفتح تلقائياً.'))return;
  try{ await api('close-ticket',{body:{id}}); toast('أُغلقت التذكرة','ok'); await loadAll(); }
  catch(e){ toast(e.message,'err') }
}

async function openBroadcast(){
  let info;
  try{ info=await api('broadcast',{body:{text:'x',dryRun:true}}); }
  catch(e){ return toast(e.message,'err') }
  const txt=prompt(`بث رسالة لـ ${info.total} طالب ربطوا تيليغرام:\n(تدعم <b>عريض</b>)`);
  if(!txt||!txt.trim())return;
  if(!confirm(`تأكيد: بترسل لـ ${info.total} طالب.\n\n"${txt.trim().slice(0,90)}"`))return;
  try{
    const r=await api('broadcast',{body:{text:txt.trim()}});
    if(!r.ok)return toast(r.error||'ما بدأ','err');
    toast(`بدأ البث لـ ${r.total} طالب — بيوصلك تقرير`,'ok');
  }catch(e){ toast(e.message,'err') }
}

async function replyTo(chatId,email,name){
  const txt=prompt(`ردك على ${name} (يوصله عبر بوت جدولك):`);
  if(!txt||!txt.trim())return;
  try{
    const r=await api('reply',{body:{chatId:chatId||null,email:email||null,text:txt.trim()}});
    if(!r.ok)return toast(r.error||'ما وصلت','err');
    toast('وصلت رسالتك ✅','ok');
  }catch(e){ toast(e.message,'err') }
}

      </div>
      ${e.fields.map(f=>`<div class="chg-row">
        <span class="chg-f">${esc(f.ar)}</span>
        <span class="chg-v"><s>${esc(f.from)}</s> ← <b>${esc(f.to)}</b></span>
      </div>`).join('')}
    </div>`).join('')}
    <div class="gauge-sub">السجل في الذاكرة فقط — يُصفَّر مع كل إعادة نشر.</div>
  </div>`:''}`;})():''}

  ${h.caches&&h.caches.finals?`<div class="sec-title">جدول الاختبارات</div>
  <div class="gauge">
    ${h.caches.finals.map(f=>`<div class="kv"><span>${esc(f.key)}</span>
      <b class="${f.ok?'good':'warn'}">${f.ok?f.count+' اختبار':'ما سُحب بعد'}${
        f.ageMin!==null?` · قبل ${f.ageMin<60?f.ageMin+' د':Math.round(f.ageMin/60)+' س'}`:''}</b></div>`).join('')}
    <div class="gauge-sub">يُحدَّث كل 6 ساعات · يُسحب أول ما يطلبه طالب</div>
  </div>

  <div class="sec-title">قائمة الدكاترة</div>
  <div class="gauge">
    <div class="kv"><span>المصدر</span><b class="good">كاش البحث</b></div>
    <div class="gauge-sub">${esc(h.caches.docs.note)}<br>
      التقييمات محفوظة في قاعدة البيانات ومستقلة عن موقع الجامعة.</div>
  </div>`:''}

  ${h.cache&&h.cache.length?`<div class="sec-title">النسخ المحفوظة الآن</div>
  <div class="gauge">
    ${h.cache.map(c=>`<div class="kv"><span style="font-family:var(--mono);font-size:11px">${esc(c.key)}</span>
      <b class="${c.valid?'good':'warn'}">${c.ageSec<90?c.ageSec+' ث':Math.round(c.ageSec/60)+' د'} ${c.valid?'✓':'منتهية'}</b></div>`).join('')}
    <div class="gauge-sub">تُمسح كلها مع كل إعادة تشغيل للسيرفر.</div>
  </div>`:`<div class="sec-title">النسخ المحفوظة الآن</div>
  <div class="gauge"><div class="fin-empty" style="padding:6px 0">الكاش فاضي — ما صار بحث بعد آخر إعادة تشغيل.</div></div>`}

  <div class="sec-title">السيرفر</div>
  <div class="gauge">
    <div class="kv"><span>يعمل منذ</span>
      <b class="${h.uptimeHours<0.5?'warn':'good'}">${h.uptimeHours<1?Math.round(h.uptimeHours*60)+' دقيقة':h.uptimeHours+' ساعة'}</b></div>
    <div class="kv"><span>الذاكرة</span>
      <b class="${h.memPct>85?'bad':h.memPct>70?'warn':'good'}">${h.memMB} م.ب · ${h.memPct}%</b></div>
    <div class="kv"><span>دورات تخطّت</span><b class="${h.skipped?'warn':'good'}">${h.skipped}</b></div>
    <div class="kv"><span>دورات مسجّلة</span><b>${h.cycleCount}</b></div>
  </div>

  ${h.lastError?`<div class="sec-title">آخر خطأ</div>
  <div class="gauge"><div class="kv"><span>${esc(h.lastError.where)}</span>
    <b class="bad">${esc(h.lastError.msg)}</b></div>
    <div class="gauge-sub">${fdate(new Date(h.lastError.at).toISOString())}</div></div>`:''}

  <div class="fin-note" style="color:var(--text3);font-size:11px;margin-top:14px;line-height:1.7">
    العدّادات تُصفّر مع كل إعادة نشر على Render. الدورة تشتغل كل 5 دقائق (300 ثانية).
  </div>`;

  /* ── تحكم سريع + تفاصيل جدولة المراقبة ── */
  const mi=h.monitorInfo||{};
  const mst=mi.state||{};
  const monOn=!h.monitorPaused;
  const running=!!mst.active;

  const fmtIn=s=>{
    if(s===null||s===undefined)return '—';
    if(s<60)return `بعد ${s} ثانية`;
    const m=Math.floor(s/60);
    if(m<60)return `بعد ${m} دقيقة`;
    const hh=Math.floor(m/60);
    return `بعد ${hh} ساعة و${m%60} دقيقة`;
  };
  const arDate=iso=>{
    if(!iso)return '—';
    const M=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const p=iso.split('-');
    return `${+p[2]} ${M[+p[1]-1]}`;
  };

  /* لماذا هي متوقفة الآن؟ سبب واحد واضح بدل التخمين */
  let why='';
  if(!monOn) why='أنت أوقفتها من هذا الزر.';
  else if(mst.reason==='disabled') why='معطّلة في متغيرات Render (MONITOR_ENABLED).';
  else if(mst.reason==='hours') why=`خارج ساعات العمل — الساعة الآن ${mi.riyadhTime||mi.riyadhHour+':00'} بتوقيت الرياض، وتبدأ ${mi.hoursFrom}:00.`;
  else if(mst.reason==='offseason') why=mi.nextWindow
      ? `خارج نوافذ التسجيل — تستأنف تلقائياً في «${esc(mi.nextWindow.ar)}» يوم ${arDate(mi.nextWindow.from)}.`
      : 'خارج نوافذ التسجيل، وما فيه نافذة قادمة في التقويم.';

  const rows=[
    ['الحالة الآن', running
      ? `<b style="color:var(--ok)">تفحص الشعب</b>`
      : `<b style="color:var(--warn)">متوقفة</b>`],
    !running&&why ? ['السبب', why] : null,
    ['الفاصل بين الدورات', `كل ${mi.intervalMin} دقائق · مع تشويش ±${mi.jitterPct}% (${mi.intervalMinLow}–${mi.intervalMinHigh} دقيقة)`],
    ['الدورة القادمة', running?fmtIn(mi.nextCycleInSec):'—'],
    ['آخر دورة', h.lastCycleAgoSec!==null&&h.lastCycleAgoSec!==undefined
      ? `قبل ${h.lastCycleAgoSec<60?h.lastCycleAgoSec+' ثانية':Math.round(h.lastCycleAgoSec/60)+' دقيقة'}`
      : 'ما صارت ولا دورة بعد إعادة التشغيل'],
    ['ساعات العمل', `${mi.hoursFrom}:00 – ${mi.hoursTo}:00 بتوقيت الرياض · الساعة الآن ${mi.riyadhTime||mi.riyadhHour+':00'}`],
    ['النافذة الحالية', mi.window
      ? `${esc(mi.window.ar)} — من ${arDate(mi.window.from)} إلى ${arDate(mi.window.to)}`
      : 'ما فيه — خارج فترات التسجيل'],
    mi.window?null:['النافذة القادمة', mi.nextWindow
      ? `${esc(mi.nextWindow.ar)} — تبدأ ${arDate(mi.nextWindow.from)}`
      : 'ما فيه نافذة قادمة'],
    ['خارج النوافذ', mi.idleOff?'المراقبة تتوقف تماماً':'مراقبة مخفّفة']
  ].filter(Boolean);

  const monCard=`<div class="maint ${running?'':'on'}">
    <div class="maint-top">
      <div>
        <div class="maint-t">${monOn?(running?'🔔 المراقبة تشتغل الآن':'🔕 المراقبة مفعّلة بس غير نشطة'):'⏸️ المراقبة موقوفة يدوياً'}</div>
        <div class="maint-s">${monOn
          ?'أوقفها فوراً لو ضغط موقع الجامعة زاد أو شفت إشعارات غلط — بدون إعادة تشغيل الخدمة.'
          :'ما يستلم أحد إشعارات فتح شعب الآن. شغّلها لما يستقر الوضع.'}</div>
      </div>
      <button class="mini ${monOn?'no':'go'}" onclick="toggleMonitor(${monOn?'false':'true'})">
        ${monOn?'⏸️ أوقف المراقبة':'▶️ شغّل المراقبة'}</button>
    </div>
    <div class="mon-grid">
      ${rows.map(([k,v])=>`<div class="mon-row"><span class="mon-k">${k}</span><span class="mon-v">${v}</span></div>`).join('')}
    </div>
    <div class="mon-edit">
      <div class="mon-elabel">⏰ ساعات العمل ${mi.hoursCustom?'<b class="warn">· يدوية</b>':''}</div>
      <div class="mon-erow">
        <span>من</span><input type="number" id="hFrom" min="0" max="23" value="${mi.hoursFrom}">
        <span>إلى</span><input type="number" id="hTo" min="1" max="24" value="${mi.hoursTo}">
        <button class="mini go" onclick="saveHours()">حفظ</button>
        ${mi.hoursCustom?'<button class="mini" onclick="saveHours(true)">تلقائي</button>':''}
      </div>
      <div class="mon-ehint">٢٤ = منتصف الليل. المراقبة تشتغل داخل هذا المدى فقط.</div>

      <div class="mon-elabel" style="margin-top:12px">📅 نافذة المراقبة ${mi.windowCustom?'<b class="warn">· يدوية</b>':''}</div>
      <div class="mon-erow">
        <span>من</span><input type="date" id="wFrom" value="${(mi.window&&mi.window.from)||(mi.nextWindow&&mi.nextWindow.from)||''}">
        <span>إلى</span><input type="date" id="wTo" value="${(mi.window&&mi.window.to)||(mi.nextWindow&&mi.nextWindow.to)||''}">
      </div>
      <div class="mon-erow">
        <button class="mini go" onclick="saveWindow()">حفظ</button>
        ${mi.windowCustom?'<button class="mini" onclick="saveWindow(true)">رجوع للتقويم</button>':''}
      </div>
      <div class="mon-ehint">النافذة اليدوية تتجاهل تواريخ التقويم المكتوبة في الكود.</div>
    </div>
  </div>`;

  const pOn=!!h.prewarmOn;
  const pw=h.prewarm||{};
  const pwCard=`<div class="maint ${pOn?'':''}">
    <div class="maint-top">
      <div>
        <div class="maint-t">${pOn?'🔥 التسخين المسبق شغّال':'💤 التسخين المسبق موقوف'}</div>
        <div class="maint-s">${pOn
          ?`يجدّد أكثر ٣ تركيبات طلباً قبل انتهاء صلاحيتها · جُدّد ${pw.refreshed||0} مرة${pw.err?' · آخر خطأ: '+esc(pw.err.msg):''}`
          :'شغّله وقت الذروة عشان ما ينتظر أي طالب سحبة كاملة من موقع الجامعة.'}</div>
      </div>
      <button class="mini ${pOn?'no':'go'}" onclick="togglePrewarm(${pOn?'false':'true'})">
        ${pOn?'⏸️ أوقفه':'▶️ شغّله'}</button>
    </div>
  </div>`;

  const cacheCard=`<div class="maint">
    <div class="maint-top">
      <div>
        <div class="maint-t">🗂️ الكاش: ${h.cacheSize||0} نسخة</div>
        <div class="maint-s">امسحه لو شفت بيانات قديمة أو غلط — أول بحث بعدها يسحب نسخة جديدة.</div>
      </div>
      <button class="mini no" onclick="clearCache()">🗑️ امسح الكاش</button>
    </div>
  </div>`;

  box.innerHTML=maint+monCard+pwCard+cacheCard+finals+alerts+liveBox+gauge+spark+detail;
}

/* ══════════ المراقبة ══════════ */
function renderMons(){
  const box=document.getElementById('monsBody');
  if(!MONS.length){
    box.innerHTML=`<div class="empty"><div class="empty-icon">📡</div>
      <div class="empty-t">ما في مواد مراقبة</div>
      <div class="empty-s">أول ما يراقب أحد مادة بتظهر هنا</div></div>`;
    return;
  }
  box.innerHTML=`<div class="sec-title">أكثر المواد طلباً</div>` + MONS.map(m=>`
    <div class="row">
      <div class="row-top">
        <div>
          <div class="row-name">${m.scope==='course'?'📡 ':''}${esc(m.key)}</div>
          <div class="row-sub">${m.scope==='course'
            ? `${m.sections!==null?m.sections+' شعبة متتبَّعة':'أول دورة لسه'} · ترم ${esc(m.term||'—')}`
            : `CRN ${esc(m.crn)} · ترم ${esc(m.term||'—')}`}</div>
        </div>
        ${m.scope==='course'
          ? '<span class="pill on">كل الشعب</span>'
          : `<span class="pill ${m.status==='OPEN'?'on':'off'}">${esc(m.status)}</span>`}
      </div>
      <div class="row-meta">
        <span>يراقبها <b>${m.watchers}</b> طالب</span>
        <button class="mini" onclick="toggleWatchers(this)">👥 المراقِبون</button>
      </div>
      <div class="watchers" hidden>
        ${(m.rows||[]).map(r=>`<div class="w-row">
          <div class="w-who">
            <b>${esc(r.name)}</b>
            <span>${esc(r.email)}${r.linked?'':' · <span class="warn">تيليغرام غير مربوط</span>'}</span>
            ${r.askedAt?`<span class="warn">⏳ مهلة تأكيد حتى ${new Date(r.askedAt).toLocaleString('ar-SA')}</span>`:''}
          </div>
          <div class="w-acts">
            <button class="mini" onclick="askWatcher(${r.id})" ${r.linked?'':'disabled'}>⏳ اسأله</button>
            <button class="mini no" onclick="stopWatcher(${r.id})">🔕 أوقف</button>
          </div>
        </div>`).join('')||'<div class="dw-empty">ما فيه تفاصيل</div>'}
      </div>
    </div>`).join('');
}

/* ══════════ إقلاع ══════════ */
(function(){
  if(TOKEN){
    api('ping').then(()=>{
      document.getElementById('gate').classList.add('hide');
      loadAll();
      /* نستعيد حالة التحديث التلقائي من آخر جلسة */
      try{ if(localStorage.getItem('adminAuto')==='1'){ AUTO=false; toggleAuto() } }catch(e){}
      paintAuto();
    }).catch(()=>logout());
  }
})();
</script>
